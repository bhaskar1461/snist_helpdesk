<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Institutional SSO Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
  <main class="login-page">
    <section class="helpdesk-shell" style="max-width: 520px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
      <header class="helpdesk-header" style="background: linear-gradient(135deg, #1e40af, #3b82f6); padding: 24px; text-align: center; color: white;">
        <h1 style="font-size: 1.5rem; margin-bottom: 6px;">Institutional Single Sign-On</h1>
        <p style="font-size: 0.88rem; opacity: 0.9;">Select or enter an institutional account to sign in</p>
      </header>

      <section class="login-stage" style="padding: 24px;">
        <div class="login-card" style="box-shadow: none; border: none; padding: 0;">
          <form method="post" action="{{ url_for('auth.sso_login') }}" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label class="field">
              <span>Institutional Email (@sreenidhi.edu.in / @suh.edu.in)</span>
              <input type="email" name="email" value="{{ default_email }}" placeholder="user@sreenidhi.edu.in" required />
            </label>

            <label class="field">
              <span>Full Name (Optional)</span>
              <input type="text" name="name" placeholder="Dr. Sreenidhi Faculty" />
            </label>

            <div style="display: flex; gap: 12px; margin-bottom: 16px;">
              <label class="field" style="flex: 1; margin: 0;">
                <span>Role</span>
                <select name="role" style="padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
                  <option value="FACULTY">FACULTY</option>
                  <option value="CA">CA</option>
                  <option value="HOD">HOD</option>
                  <option value="ADMIN">ADMIN</option>
                </select>
              </label>
              <label class="field" style="flex: 1; margin: 0;">
                <span>Department</span>
                <select name="department" style="padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
                  <option value="CSE">CSE</option>
                  <option value="ECE">ECE</option>
                  <option value="EEE">EEE</option>
                  <option value="MECH">MECH</option>
                  <option value="CIVIL">CIVIL</option>
                  <option value="IT">IT</option>
                </select>
              </label>
            </div>

            <button type="submit" class="login-btn" style="background: linear-gradient(135deg, #1d4ed8, #2563eb);">Authorize SSO Login</button>
          </form>

          <div style="text-align: center; margin-top: 20px;">
            <a href="{{ url_for('auth.login') }}" style="color: #64748b; font-size: 0.85rem; text-decoration: none;">&larr; Return to Helpdesk Login</a>
          </div>
        </div>
      </section>
    </section>
  </main>
</body>
</html>

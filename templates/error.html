<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error {{ error_code }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: #f9fafb; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #1e293b; }
    .error-page { text-align: center; max-width: 480px; padding: 2rem; }
    .error-code { font-size: 7rem; font-weight: 700; color: #4f46e5; line-height: 1; margin-bottom: .5rem; }
    .error-title { font-size: 1.5rem; font-weight: 600; margin-bottom: .75rem; }
    .error-msg { font-size: 1rem; color: #6b7280; margin-bottom: 2rem; line-height: 1.6; }
    .error-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .error-actions a { padding: 12px 24px; border-radius: 10px; font-weight: 600; font-size: .92rem; text-decoration: none; transition: all .2s; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-code">{{ error_code }}</div>
    <h1 class="error-title">{{ error_title }}</h1>
    <p class="error-msg">{{ error_message }}</p>
    <div class="error-actions">
      <a href="/" class="btn-primary">Go Home</a>
      <a href="javascript:history.back()" class="btn-secondary">Go Back</a>
    </div>
  </div>
</body>
</html>

# Render.com deployment blueprint for SNIST Helpdesk
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: snist-helpdesk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: INIT_DEMO_DB
        value: "true"
